<html><head><style>p{color:red}</style></head><body><h1>Sourdough for beginners</h1>
<p>Feed your starter daily with equal parts flour and water. Once it doubles in size within
a few hours it is ready. Mix the dough, let it ferment overnight, shape it, and bake in a
preheated dutch oven for a crisp crust.</p></body></html>
